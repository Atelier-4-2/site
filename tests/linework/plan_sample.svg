<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
  <style>
    .w07 { stroke: #000000; stroke-width: 0.7; fill: none; }
    .w035 { stroke: #000000; stroke-width: 0.35; fill: none; }
  </style>
  <!-- light floor tint: bright fill -> hide -->
  <rect x="40" y="40" width="300" height="200" fill="#EEEEEE" stroke="none"/>
  <g transform="translate(20 10)">
    <!-- 0.70 mm: structural walls (class cut) -->
    <path class="w07" d="M 20 30 H 320 V 230 H 20 Z"/>
    <path class="w07" d="M 170 30 V 230"/>
    <!-- 0.35 mm: partitions (class part) -->
    <path class="w035" d="M 20 130 H 170"/>
    <path class="w035" d="M 170 150 H 320"/>
    <!-- 0.18 mm: windows, doors, stair (class vis) -->
    <g fill="none" stroke="#333333" stroke-width="0.18">
      <line x1="60" y1="30" x2="100" y2="30"/>
      <line x1="60" y1="27" x2="100" y2="27"/>
      <polyline points="260,230 300,230 300,226"/>
      <path d="M 120 130 A 20 20 0 0 1 140 150"/>
      <rect x="230" y="60" width="60" height="30"/>
    </g>
    <!-- 0.09 mm: furniture / dimensions (class thin) -->
    <g fill="none" stroke="#777777" stroke-width="0.09">
      <rect x="30" y="40" width="40" height="25"/>
      <rect x="190" y="170" width="50" height="30"/>
      <circle cx="260" cy="190" r="12"/>
      <line x1="20" y1="245" x2="320" y2="245"/>
    </g>
    <!-- dashed 0.18 mm: upper floor projection (class hidden) -->
    <path d="M 40 60 H 150 V 110" fill="none" stroke="#555555" stroke-width="0.18" stroke-dasharray="3 2"/>
    <!-- black poche column: dark fill only (class cut, drawn as outline) -->
    <polygon points="165,125 175,125 175,135 165,135" fill="#000000" stroke="none"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#000000">
    <text x="60" y="80" font-size="5">Séjour</text>
    <text x="215" y="90" font-size="5">Chambre</text>
    <text x="30" y="270" font-size="3.5">1/100</text>
  </g>
</svg>
