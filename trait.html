<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trait · PDF → DXF · Atelier 4·2</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { color-scheme:light; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --divider:#d2d2d7; --surface:#f5f5f7; --paper:#fff; --bg:#fff; --header-bg:rgba(255,255,255,.9); --on-ink:#fff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme:dark; --ink:#f5f5f7; --muted:#a1a1a6; --line:#2c2c2e; --divider:#48484a; --surface:#1d1d1f; --paper:#141416; --bg:#000; --header-bg:rgba(0,0,0,.85); --on-ink:#1d1d1f; }
    }
    :root[data-theme="dark"] { color-scheme:dark; --ink:#f5f5f7; --muted:#a1a1a6; --line:#2c2c2e; --divider:#48484a; --surface:#1d1d1f; --paper:#141416; --bg:#000; --header-bg:rgba(0,0,0,.85); --on-ink:#1d1d1f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Pretendard Variable","Pretendard",system-ui,sans-serif; word-break:keep-all; }
    header { position:sticky; top:0; z-index:10; background:var(--header-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--divider); }
    .nav { max-width:1160px; margin:0 auto; padding:6px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .brand { font-weight:700; font-size:19px; text-decoration:none; color:var(--ink); flex:none; }
    .site-switch { display:inline-flex; gap:2px; padding:3px; border-radius:980px; background:var(--surface); overflow-x:auto; max-width:100%; scrollbar-width:none; }
    .site-switch::-webkit-scrollbar { display:none; }
    .site-switch a { flex:none; white-space:nowrap; padding:6px 10px; border-radius:980px; font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; }
    .site-switch a.cur { background:var(--ink); color:var(--on-ink); }
    main { max-width:1160px; margin:0 auto; padding:20px 16px 40px; display:grid; gap:16px; }
    h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
    .sub { margin:4px 0 0; color:var(--muted); font-size:14px; }
    .grid { display:grid; grid-template-columns:320px minmax(0,1fr); gap:16px; align-items:start; }
    .card { border:1px solid var(--line); border-radius:16px; padding:16px; background:var(--paper); display:grid; gap:10px; }
    .drop { display:grid; place-items:center; text-align:center; padding:20px; border:1.5px dashed var(--divider); border-radius:14px; background:var(--surface); cursor:pointer; }
    .field { display:grid; gap:4px; font-size:13px; }
    .field input, .field select { min-height:36px; border:1px solid var(--divider); border-radius:10px; padding:0 10px; font:inherit; background:var(--surface); color:var(--ink); }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btn { min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--ink); background:var(--ink); color:var(--on-ink); font:600 13px/1 inherit; cursor:pointer; }
    .btn:disabled { opacity:.4; cursor:default; }
    .layers { list-style:none; margin:0; padding:0; display:grid; gap:6px; max-height:260px; overflow:auto; font-size:12.5px; }
    .layers li { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .sw { width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.2); flex:none; }
    canvas { width:100%; min-height:360px; border:1px solid var(--line); border-radius:14px; background:#fff; }
    @media (max-width:840px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="https://atelier-4-2.github.io/">4·2 · Trait</a>
      <nav class="site-switch">
        <a href="./">Terrain</a>
        <a href="./#board">Board</a>
        <a href="https://atelier-4-2.github.io/view/">View</a>
        <a href="https://atelier-4-2.github.io/crit/">Crit</a>
        <a href="https://atelier-4-2.github.io/share/">Share</a>
        <a href="https://atelier-4-2.github.io/quiz/">Quiz</a>
        <a href="./stair.html">Stair</a>
        <a href="./trait.html" class="cur">Trait</a>
      </nav>
    </div>
  </header>

  <main>
    <div>
      <h1>벡터 PDF → DXF 변환기</h1>
      <p class="sub">벡터 PDF 도면을 브라우저 안에서 바로 DXF로 변환합니다. 선 굵기·색별로 레이어를 자동 분리하며, 파일은 서버로 전송되지 않습니다.</p>
    </div>

    <div class="grid">
      <section class="card">
        <label class="drop">
          <input id="pdfIn" type="file" accept="application/pdf,.pdf" hidden>
          <strong>PDF 도면 선택</strong>
          <span style="font-size:12.5px;color:var(--muted)">벡터 PDF (Rhino · CAD · Illustrator)</span>
        </label>
        <div class="row2">
          <label class="field">축척 (1 : N)<input id="inScale" type="number" min="1" max="10000" value="100"></label>
          <label class="field">출력 단위
            <select id="inUnit">
              <option value="m">미터 (m)</option>
              <option value="mm">밀리미터 (mm)</option>
            </select>
          </label>
        </div>
        <label class="field">페이지<select id="inPage"></select></label>
        <p id="st" style="margin:0;font-size:12.5px;color:var(--muted)">PDF 파일을 선택하면 선을 추출합니다.</p>
        <ul id="layerList" class="layers"></ul>
        <button type="button" class="btn" id="btnDxf" disabled>DXF 내려받기</button>
      </section>

      <section>
        <canvas id="cv" width="900" height="640"></canvas>
      </section>
    </div>
  </main>

  <script type="module">
    const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
    const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
    const $ = id => document.getElementById(id);
    let pdfjs = null, pdfDoc = null, fileName = "drawing", segments = [], layerMap = new Map(), pageBox = [0, 0, 595, 842];

    async function ensurePdfJs() {
      if (pdfjs) return pdfjs;
      pdfjs = await import(PDFJS_URL);
      pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      return pdfjs;
    }
    const mulM = (a, b) => [
      a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1],
      a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3],
      a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]
    ];
    const txPt = (m, x, y) => [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];
    const hex = (r, g, b) => [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");

    async function extractPage(pageNum) {
      $("st").textContent = "벡터 선을 추출하는 중…";
      const page = await pdfDoc.getPage(pageNum);
      const vp = page.getViewport({ scale: 1 });
      pageBox = [0, 0, vp.width, vp.height];
      const opList = await page.getOperatorList();
      const OPS = pdfjs.OPS;

      const stack = [];
      let ctm = [1, 0, 0, 1, 0, 0], lw = 1, color = "000000";
      let path = [], cur = [0, 0], start = [0, 0];
      segments = []; layerMap = new Map();

      const addSeg = (x1, y1, x2, y2) => {
        if (Math.hypot(x2 - x1, y2 - y1) < 0.05) return;
        const mmW = Math.round(lw * 25.4 / 72 * 100); // 0.01 mm units
        const lname = `L_${String(mmW).padStart(3, "0")}_${color}`;
        if (!layerMap.has(lname)) layerMap.set(lname, { name: lname, color: "#" + color, lw: (lw * 25.4 / 72).toFixed(2), count: 0, on: true });
        layerMap.get(lname).count++;
        segments.push({ layer: lname, x1, y1, x2, y2 });
      };
      const flushPath = () => {
        for (const s of path) addSeg(s[0], s[1], s[2], s[3]);
        path = [];
      };

      for (let i = 0; i < opList.fnArray.length; i++) {
        const fn = opList.fnArray[i], args = opList.argsArray[i];
        if (fn === OPS.save) stack.push({ ctm: ctm.slice(), lw, color });
        else if (fn === OPS.restore) { const s = stack.pop(); if (s) { ctm = s.ctm; lw = s.lw; color = s.color; } }
        else if (fn === OPS.transform) ctm = mulM(ctm, args);
        else if (fn === OPS.setLineWidth) lw = Math.max(0.1, +args[0] || 1);
        else if (fn === OPS.setStrokeRGBColor) color = hex(args[0], args[1], args[2]);
        else if (fn === OPS.setStrokeGray) { const g = args[0] <= 1 ? args[0] * 255 : args[0]; color = hex(g, g, g); }
        else if (fn === OPS.constructPath) {
          const ops = args[0], nums = args[1]; let k = 0;
          for (const op of ops) {
            if (op === OPS.moveTo) { cur = txPt(ctm, nums[k], nums[k+1]); start = cur; k += 2; }
            else if (op === OPS.lineTo) { const p = txPt(ctm, nums[k], nums[k+1]); path.push([cur[0], cur[1], p[0], p[1]]); cur = p; k += 2; }
            else if (op === OPS.curveTo) {
              const p0 = cur, p1 = txPt(ctm, nums[k], nums[k+1]), p2 = txPt(ctm, nums[k+2], nums[k+3]), p3 = txPt(ctm, nums[k+4], nums[k+5]); k += 6;
              let prev = p0;
              for (let t = 1; t <= 8; t++) {
                const u = t / 8, m = 1 - u;
                const q = [m*m*m*p0[0]+3*m*m*u*p1[0]+3*m*u*u*p2[0]+u*u*u*p3[0], m*m*m*p0[1]+3*m*m*u*p1[1]+3*m*u*u*p2[1]+u*u*u*p3[1]];
                path.push([prev[0], prev[1], q[0], q[1]]); prev = q;
              }
              cur = p3;
            } else if (op === OPS.rectangle) {
              const rx = nums[k], ry = nums[k+1], rw = nums[k+2], rh = nums[k+3]; k += 4;
              const a = txPt(ctm, rx, ry), b = txPt(ctm, rx+rw, ry), c = txPt(ctm, rx+rw, ry+rh), d = txPt(ctm, rx, ry+rh);
              path.push([a[0],a[1],b[0],b[1]], [b[0],b[1],c[0],c[1]], [c[0],c[1],d[0],d[1]], [d[0],d[1],a[0],a[1]]);
              cur = a; start = a;
            } else if (op === OPS.closePath) {
              path.push([cur[0], cur[1], start[0], start[1]]); cur = start;
            }
          }
        }
        else if (fn === OPS.stroke || fn === OPS.closeStroke || fn === OPS.fillStroke || fn === OPS.eoFillStroke || fn === OPS.closeFillStroke || fn === OPS.closeEOFillStroke) flushPath();
        else if (fn === OPS.fill || fn === OPS.eoFill || fn === OPS.endPath) path = [];
      }

      $("btnDxf").disabled = segments.length === 0;
      $("st").textContent = segments.length ? `선 ${segments.length.toLocaleString()}개 · 레이어 ${layerMap.size}개 추출됨` : "벡터 선이 없는 스캔(이미지) PDF입니다.";
      renderLayers();
      renderCanvas();
    }

    function renderLayers() {
      const ul = $("layerList"); ul.textContent = "";
      for (const L of layerMap.values()) {
        const li = document.createElement("li");
        const chk = document.createElement("input"); chk.type = "checkbox"; chk.checked = L.on;
        chk.onchange = () => { L.on = chk.checked; renderCanvas(); };
        const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = L.color;
        const tx = document.createElement("span"); tx.textContent = `${L.name} (${L.lw}mm · ${L.count}선)`;
        li.append(chk, sw, tx); ul.append(li);
      }
    }

    function renderCanvas() {
      const cv = $("cv"), g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
      if (!segments.length) return;
      const bw = pageBox[2] || 600, bh = pageBox[3] || 600;
      const pad = 24, s = Math.min((cv.width - pad * 2) / bw, (cv.height - pad * 2) / bh);
      const ox = (cv.width - bw * s) / 2, oy = (cv.height - bh * s) / 2;
      g.lineWidth = 1;
      for (const seg of segments) {
        const L = layerMap.get(seg.layer);
        if (!L || !L.on) continue;
        g.strokeStyle = L.color;
        g.beginPath();
        g.moveTo(ox + seg.x1 * s, cv.height - (oy + seg.y1 * s));
        g.lineTo(ox + seg.x2 * s, cv.height - (oy + seg.y2 * s));
        g.stroke();
      }
    }

    function exportDxf() {
      const scale = Math.max(1, +$("inScale").value || 100);
      const unitK = $("inUnit").value === "mm" ? 1 : 0.001; // pt -> mm -> m or mm
      const k = (25.4 / 72) * scale * unitK;
      const out = ["0","SECTION","2","ENTITIES"];
      for (const seg of segments) {
        const L = layerMap.get(seg.layer);
        if (!L || !L.on) continue;
        out.push("0","LINE","8",seg.layer,"10",(seg.x1*k).toFixed(4),"20",(seg.y1*k).toFixed(4),"11",(seg.x2*k).toFixed(4),"21",(seg.y2*k).toFixed(4));
      }
      out.push("0","ENDSEC","0","EOF");
      const b = new Blob([out.join("\n")], { type: "application/dxf" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${fileName}_1-${scale}_${$("inUnit").value}.dxf`; a.click();
    }

    $("pdfIn").onchange = async e => {
      const f = e.target.files?.[0]; if (!f) return;
      fileName = f.name.replace(/\.[^.]+$/, "");
      const lib = await ensurePdfJs();
      pdfDoc = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
      const sel = $("inPage"); sel.textContent = "";
      for (let i = 1; i <= pdfDoc.numPages; i++) { const o = document.createElement("option"); o.value = i; o.textContent = `${i} / ${pdfDoc.numPages}쪽`; sel.append(o); }
      await extractPage(1);
    };
    $("inPage").onchange = () => { if (pdfDoc) extractPage(+$("inPage").value); };
    $("btnDxf").onclick = exportDxf;
  </script>
</body>
</html>
