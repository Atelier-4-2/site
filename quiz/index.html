<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Histoire — 4·2</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../brand.css?v=20261118l1">
  <link rel="stylesheet" href="../fonts.css?v=20261118f1">

  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --accent: #e6b89c;
      --paper: #ffffff;
      --background: #ffffff;
      --surface: #f5f5f7;
      --line: #d2d2d7;
      --nav: rgb(255 255 255 / 80%);
      --on-primary: #ffffff;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ink: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #e6b89c;
        --paper: #000000;
        --background: #000000;
        --surface: #1d1d1f;
        --line: #48484a;
        --nav: rgb(0 0 0 / 80%);
        --on-primary: #1d1d1f;
        --ok: #4ade80;
        --ok-bg: rgb(21 128 61 / 22%);
        --bad: #f87171;
        --bad-bg: rgb(185 28 28 / 22%);
      }
      #brand-home .brand-mark,
      #brand-home .brand-tool,
      footer .brand-name {
        color: #f5f5f7;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font: 16px/1.6 "Pretendard Variable", "Pretendard", -apple-system,
        BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow-wrap: anywhere;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--nav);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #brand-home {
      text-decoration: none;
    }

    .nav-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 980px;
      font-size: 13px;
      font-weight: 600;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .stat-pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .stat-pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 16px 88px;
    }

    .hero-head {
      margin-bottom: 20px;
    }

    .hero-head .eyebrow {
      margin: 0 0 4px;
    }

    .hero-head h1 {
      margin: 0;
      font-size: clamp(24px, 3.6vw, 32px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .hero-head p.sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: var(--surface);
      border-radius: 980px;
      overflow: hidden;
      margin: 14px 0 22px;
    }

    .progress-fill {
      height: 100%;
      background: var(--ink);
      transition: width 250ms ease;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    button.pill-btn {
      appearance: none;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--background);
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
    }

    button.pill-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    button.pill-btn.active {
      background: var(--ink);
      color: var(--on-primary);
      border-color: var(--ink);
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: var(--surface);
    }

    .controls-bar label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .controls-bar select,
    .controls-bar input[type="text"] {
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 14px;
    }

    .btn {
      appearance: none;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface);
      border-color: var(--ink);
    }

    .btn.primary {
      background: var(--ink);
      color: var(--on-primary);
      border-color: var(--ink);
    }

    .btn.primary:hover:not(:disabled) {
      opacity: 0.88;
      background: var(--ink);
    }

    .btn.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: transparent;
    }

    .btn.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: transparent;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .chapter-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 980px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .counter {
      font-family: "Instrument Sans", sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .photo-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: 360px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-fallback {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .photo-fallback a {
      display: inline-block;
      margin-top: 8px;
      color: var(--ink);
      font-weight: 600;
      text-underline-offset: 3px;
    }

    .project-title {
      margin: 0 0 6px;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .sub-hint {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--muted);
    }

    .options-grid {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 140ms ease, background-color 140ms ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--ink);
      background: var(--surface);
    }

    .option-key {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-family: "Instrument Sans", sans-serif;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .option-btn.correct {
      border-color: var(--ok);
      background: var(--ok-bg);
    }
    .option-btn.correct .option-key { background: var(--ok); color: #fff; }

    .option-btn.wrong {
      border-color: var(--bad);
      background: var(--bad-bg);
    }
    .option-btn.wrong .option-key { background: var(--bad); color: #fff; }

    .answer-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: var(--surface);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .meta-item {
      background: var(--paper);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .meta-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .meta-val {
      font-size: 14px;
      font-weight: 600;
      margin-top: 2px;
    }

    .desc-fr {
      font-size: 14px;
      line-height: 1.6;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .ko-tip {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      background: var(--paper);
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .kbd-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .exam-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .exam-inputs input,
    .field-textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 14px;
    }

    .grid-list {
      display: grid;
      gap: 12px;
    }

    .pairs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .pair-card {
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .pair-card h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .pair-card p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }

    .list-row {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 14px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--paper);
      align-items: start;
    }

    .list-thumb {
      width: 112px;
      height: 78px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .list-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    footer {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 560px) {
      .card { padding: 16px; }
      .list-row { grid-template-columns: 1fr; }
      .list-thumb { width: 100%; height: 150px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="nav-inner">
      <a id="brand-home" class="product-name" href="../" aria-label="4·2 홈으로">

        <select class="site-switcher" aria-label="사이트 전환" onchange="if(this.value)location.href=this.value">
          <option value="./" selected>4·2 Histoire (Quiz)</option>
          <option value="../">4·2 Terrain</option>
        </select></div>

  <main class="container">
    <div class="hero-head">
      <p class="eyebrow brand-eyebrow">4·2 Study — Histoire globale</p>
      <h1>30개 프로젝트 퀴즈 &amp; 플래시카드</h1>
      <p class="sub">Paul Wolkenstein 기말시험 대비 · 사진 / 건축가 / 프로젝트명 / 장소 / 슬라이드 연도 / FR 설명</p>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="mode-tabs" id="modeTabs">
      <button class="pill-btn active" data-mode="photo">사진 퀴즈</button>
      <button class="pill-btn" data-mode="flashcard">플래시카드</button>
      <button class="pill-btn" data-mode="quiz">4지선다</button>
      <button class="pill-btn" data-mode="exam">실전 1번 모의 (3개)</button>
      <button class="pill-btn" data-mode="pairs">헷갈리는 6쌍</button>
      <button class="pill-btn" data-mode="list">전체 30개</button>

    <div class="controls-bar" id="controlsBar"></div>
    <section id="mainView"></section>
  </main>

  <footer>
    <p class="brand-footer"><span class="brand-name">4·2</span> · Histoire globale (1960–1990) 기말 대비 학습 페이지</p>
    <p><a href="../" style="color:inherit;">4·2 Terrain으로 돌아가기</a> · <a href="../legal.html" style="color:inherit;">Mentions légales</a></p>
  </footer>

    let progress = loadProgress();
    let state = {
      mode: "photo",
      chapter: "ALL",

      onlyWithPhoto: true,

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      } catch {}
    }

    function getStatus(id) {
      return progress[id] || "new";
    }

    function setStatus(id, st) {
      progress[id] = st;
      saveProgress();
      renderStats();
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getFiltered() {
      return PROJECTS.filter(p => {
        if (state.chapter !== "ALL" && p.chapter !== state.chapter) return false;
        if (state.onlyWeak && getStatus(p.id) === "mastered") return false;
        if (state.mode === "photo" && state.onlyWithPhoto && !p.img) return false;
        return true;
      });
    }

    function rebuildPool() {
      state.pool = shuffle(getFiltered());
      state.index = 0;
      state.answered = false;
      state.selectedOption = null;
      state.photoRevealed = false;
      state.flashFlipped = false;
    }

    function googleImgUrl(p) {
      return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p.name + " " + p.architect)}`;
    }

    function renderPhotoBox(p, hideTitle = false) {
      if (p.img) {
        return `
          <div class="photo-frame">
            <img src="${p.img}" alt="${hideTitle ? "Architecture project" : p.name}" loading="lazy"
                 onerror="this.parentElement.innerHTML='<div class=photo-fallback>이미지를 불러올 수 없습니다.<br><a href=\\'${googleImgUrl(p)}\\' target=_blank rel=noopener>구글 이미지로 보기 ↗</a></div>'">
          </div>
        `;
      }
      return `
        <div class="photo-frame">
          <div class="photo-fallback">
            <div>위키미디어 대표 사진 미수록 프로젝트</div>
            <div style="margin-top:4px;font-size:13px;">단서: ${p.desc}</div>
            <a href="${googleImgUrl(p)}" target="_blank" rel="noopener">구글 이미지로 사진 확인하기 ↗</a>
          </div>
        </div>
      `;
    }

    function renderStats() {
      const mastered = PROJECTS.filter(p => getStatus(p.id) === "mastered").length;
      const review = PROJECTS.filter(p => getStatus(p.id) === "review").length;
      const pct = Math.round((mastered / PROJECTS.length) * 100);
      document.getElementById("progressFill").style.width = `${pct}%`;
      document.getElementById("statsBar").innerHTML = `
        <span class="stat-pill ok">암기 ${mastered}/30</span>
        <span class="stat-pill bad">복습 ${review}</span>
        ${state.sessionTotal > 0 ? `<span class="stat-pill">정답 ${state.sessionCorrect}/${state.sessionTotal}</span>` : ""}
      `;
    }

    function renderControls() {
      const bar = document.getElementById("controlsBar");
      if (state.mode === "pairs") {
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";

      let html = `
        <label>단원
          <select id="chapterSelect">
            ${CHAPTERS.map(c => `<option value="${c}" ${state.chapter === c ? "selected" : ""}>${c === "ALL" ? "전체 (30개)" : c}</option>`).join("")}
          </select>
        </label>
        <label style="cursor:pointer;">
          <input type="checkbox" id="weakCheck" ${state.onlyWeak ? "checked" : ""}>
          미암기·복습만
        </label>
      `;

      if (state.mode === "photo") {
        html += `
          <label style="cursor:pointer;">
            <input type="checkbox" id="photoOnlyCheck" ${state.onlyWithPhoto ? "checked" : ""}>
            사진 있는 프로젝트만 (15개)
          </label>
          <button class="btn" id="shuffleBtn">순서 섞기</button>
        `;
      } else if (state.mode === "quiz") {
        html += `
          <label>출제
            <select id="quizTypeSelect">
              <option value="architect" ${state.quizType === "architect" ? "selected" : ""}>건축가 맞히기</option>
              <option value="name" ${state.quizType === "name" ? "selected" : ""}>건물명 맞히기</option>
              <option value="year" ${state.quizType === "year" ? "selected" : ""}>연도 맞히기</option>
              <option value="location" ${state.quizType === "location" ? "selected" : ""}>장소 맞히기</option>
            </select>
          </label>
          <button class="btn" id="shuffleBtn">순서 섞기</button>
        `;
      } else if (state.mode === "flashcard") {
        html += `<button class="btn" id="shuffleBtn">카드 섞기</button>`;
      } else if (state.mode === "exam") {
        html += `<button class="btn primary" id="newExamBtn">새로 3개 뽑기</button>`;
      } else if (state.mode === "list") {
        html += `

          <button class="btn" id="resetBtn">진행률 초기화</button>
        `;
      }

      bar.innerHTML = html;

        state.chapter = e.target.value;
        rebuildPool();
        renderMain();
      });
      document.getElementById("weakCheck")?.addEventListener("change", e => {
        state.onlyWeak = e.target.checked;
        rebuildPool();
        renderMain();
      });
      document.getElementById("photoOnlyCheck")?.addEventListener("change", e => {
        state.onlyWithPhoto = e.target.checked;
        rebuildPool();
        renderMain();
      });
      document.getElementById("quizTypeSelect")?.addEventListener("change", e => {
        state.quizType = e.target.value;
        state.answered = false;
        state.selectedOption = null;
        renderMain();
      });
      document.getElementById("shuffleBtn")?.addEventListener("click", () => {
        rebuildPool();
        renderMain();
      });
      document.getElementById("newExamBtn")?.addEventListener("click", () => {
        const src = getFiltered();
        state.examSet = shuffle(src.length >= 3 ? src : PROJECTS).slice(0, 3);
        state.examRevealed = {};
        renderMain();
      });
      document.getElementById("searchInput")?.addEventListener("input", e => {
        state.searchQuery = e.target.value;
        renderMain();
      });
      document.getElementById("resetBtn")?.addEventListener("click", () => {
        if (confirm("암기 상태를 모두 초기화할까요?")) {
          progress = {};
          saveProgress();
          render();
        }
      });

              <div class="meta-label">Date (Slide)</div>
              <div class="meta-val">${p.year}</div>
            </div>
          </div>
          <div class="desc-fr">${p.desc}</div>
          ${p.koTip ? `<div class="ko-tip">${p.koTip}</div>` : ""}
        </div>
      `;
    }

    let cachedKey = "";
    let cachedQ = null;

    function buildQuestion(p, type) {
      const others = shuffle(PROJECTS.filter(x => x.id !== p.id));
      let title = "", sub = "", correct = "", opts = [];
      if (type === "architect") {
        title = p.name;
        sub = `${p.location} · 건축가는?`;
        correct = p.architect;
        const picks = [];
        for (const o of others) {
          if (o.architect !== correct && !picks.includes(o.architect)) {
            picks.push(o.architect);
            if (picks.length === 3) break;
          }
        }
        opts = shuffle([correct, ...picks]);
      } else if (type === "name") {
        title = `${p.architect} (${p.year})`;
        sub = p.desc;
        correct = p.name;
        opts = shuffle([correct, ...others.slice(0, 3).map(o => o.name)]);
      } else if (type === "year") {
        title = p.name;
        sub = `${p.architect} · 슬라이드 기준 연도는?`;
        correct = p.year;
        const picks = [];
        for (const o of others) {
          if (o.year !== correct && !picks.includes(o.year)) {
            picks.push(o.year);
            if (picks.length === 3) break;
          }
        }
        opts = shuffle([correct, ...picks]);
      } else {
        title = p.name;
        sub = `${p.architect} · 장소는?`;
        correct = p.location;
        const picks = [];
        for (const o of others) {
          if (o.location !== correct && !picks.includes(o.location)) {
            picks.push(o.location);
            if (picks.length === 3) break;
          }
        }
        opts = shuffle([correct, ...picks]);
      }
      return { title, sub, correct, opts };
    }

    function renderPhotoQuiz(main) {
      if (state.pool.length === 0) rebuildPool();
      if (state.pool.length === 0) {
        main.innerHTML = `<div class="card"><p>조건에 맞는 프로젝트가 없습니다. 필터를 조정해 주세요.</p></div>`;
        return;
      }
      const idx = state.index % state.pool.length;
      const p = state.pool[idx];

      main.innerHTML = `
        <div class="card">
          <div class="card-top">
            <span class="chapter-badge">${state.photoRevealed ? p.chapter : "사진 보고 맞히기"}</span>
            <span class="counter">${idx + 1} / ${state.pool.length}</span>
          </div>

          ${renderPhotoBox(p, true)}

          ${!state.photoRevealed ? `
            <p class="sub-hint">건물 이름 · 건축가 · 장소 · 연도를 떠올린 뒤 아래에 적어보거나 바로 확인하세요.</p>
            <div class="exam-inputs">
              <div><label class="field-label">건물명</label><input type="text" placeholder="Projet"></div>
              <div><label class="field-label">건축가</label><input type="text" placeholder="Architecte"></div>
              <div><label class="field-label">연도</label><input type="text" placeholder="Date"></div>
            </div>
            <button class="btn primary" id="revealPhotoBtn">정답 확인 (Space)</button>
          ` : renderDetailBlock(p)}

          <div class="card-actions">
            <div style="display:flex;gap:8px;">
              <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" id="pMastered">암기 완료 (1)</button>
              <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" id="pReview">복습 필요 (2)</button>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn" id="pPrev">← 이전</button>
              <button class="btn primary" id="pNext">다음 →</button>
            </div>
          </div>
          <div class="kbd-hint">단축키: Space 정답 확인 · 1 암기 완료 · 2 복습 필요 · ←/→ 이동</div>
        </div>
      `;

      document.getElementById("revealPhotoBtn")?.addEventListener("click", () => {
        state.photoRevealed = true;
        renderMain();
      });
      document.getElementById("pMastered")?.addEventListener("click", () => {
        setStatus(p.id, "mastered");
        state.index = (state.index + 1) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
      document.getElementById("pReview")?.addEventListener("click", () => {
        setStatus(p.id, "review");
        state.index = (state.index + 1) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
      document.getElementById("pPrev")?.addEventListener("click", () => {
        state.index = (state.index - 1 + state.pool.length) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
      document.getElementById("pNext")?.addEventListener("click", () => {
        state.index = (state.index + 1) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
    }

    function renderFlashcard(main) {
      if (state.pool.length === 0) rebuildPool();
      if (state.pool.length === 0) {
        main.innerHTML = `<div class="card"><p>조건에 맞는 프로젝트가 없습니다.</p></div>`;
        return;
      }
      const idx = state.index % state.pool.length;
      const p = state.pool[idx];

      main.innerHTML = `
        <div class="card">
          <div class="card-top">
            <span class="chapter-badge">${state.flashFlipped || state.flashHint ? p.chapter : "단원 숨김"}</span>
            <span class="counter">${idx + 1} / ${state.pool.length}</span>
          </div>

          <h2 class="project-title">${p.name}</h2>
          ${!state.flashFlipped ? `
            <p class="sub-hint">건축가 · 장소 · 연도 · 프랑스어 설명을 떠올려 보세요.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn primary" id="flipBtn">카드 뒤집기 (Space)</button>
              <button class="btn" id="hintBtn">${state.flashHint ? "힌트 숨기기" : "단원 힌트"}</button>
            </div>
          ` : `
            ${p.img ? renderPhotoBox(p) : ""}
            ${renderDetailBlock(p)}
            <div style="margin-top:12px;">
              <button class="btn" id="flipBtn">앞면으로</button>
            </div>
          `}

          <div class="card-actions">
            <div style="display:flex;gap:8px;">
              <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" id="fcOk">암기 완료 (1)</button>
              <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" id="fcBad">복습 필요 (2)</button>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn" id="fcPrev">← 이전</button>
              <button class="btn primary" id="fcNext">다음 →</button>
            </div>
          </div>
          <div class="kbd-hint">단축키: Space 뒤집기 · 1 암기 완료 · 2 복습 필요 · ←/→ 이동</div>
        </div>
      `;

      document.getElementById("flipBtn")?.addEventListener("click", () => {
        state.flashFlipped = !state.flashFlipped;
        renderMain();
      });
      document.getElementById("hintBtn")?.addEventListener("click", () => {
        state.flashHint = !state.flashHint;
        renderMain();
      });
      document.getElementById("fcOk")?.addEventListener("click", () => {
        setStatus(p.id, "mastered");
        state.index = (state.index + 1) % state.pool.length;
        state.flashFlipped = false;
        renderMain();
      });
      document.getElementById("fcBad")?.addEventListener("click", () => {
        setStatus(p.id, "review");
        state.index = (state.index + 1) % state.pool.length;
        state.flashFlipped = false;
        renderMain();
      });
      document.getElementById("fcPrev")?.addEventListener("click", () => {
        state.index = (state.index - 1 + state.pool.length) % state.pool.length;
        state.flashFlipped = false;
        renderMain();
      });
      document.getElementById("fcNext")?.addEventListener("click", () => {
        state.index = (state.index + 1) % state.pool.length;
        state.flashFlipped = false;
        renderMain();
      });
    }

    function renderQuiz(main) {
      if (state.pool.length === 0) rebuildPool();
      if (state.pool.length === 0) {
        main.innerHTML = `<div class="card"><p>조건에 맞는 프로젝트가 없습니다.</p></div>`;
        return;
      }
      const idx = state.index % state.pool.length;
      const p = state.pool[idx];
      const key = `${p.id}-${state.quizType}-${idx}`;
      if (cachedKey !== key) {
        cachedKey = key;
        cachedQ = buildQuestion(p, state.quizType);
      }
      const q = cachedQ;

      main.innerHTML = `
        <div class="card">
          <div class="card-top">
            <span class="chapter-badge">${p.chapter}</span>
            <span class="counter">${idx + 1} / ${state.pool.length}</span>
          </div>
          <h2 class="project-title">${q.title}</h2>
          <p class="sub-hint">${q.sub}</p>

          <div class="options-grid">
            ${q.opts.map((opt, i) => {
              let cls = "option-btn";
              if (state.answered) {
                if (opt === q.correct) cls += " correct";
                else if (opt === state.selectedOption) cls += " wrong";
              }
              return `
                <button class="${cls}" data-opt="${i}" ${state.answered ? "disabled" : ""}>
                  <span class="option-key">${i + 1}</span>
                  <span>${opt}</span>
                </button>
              `;
            }).join("")}
          </div>

          ${state.answered ? renderDetailBlock(p) : ""}

          <div class="card-actions">
            <div style="display:flex;gap:8px;">
              <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" id="qOk">암기 완료</button>
              <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" id="qBad">복습 필요</button>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn" id="qPrev">← 이전</button>
              <button class="btn primary" id="qNext">다음 →</button>
            </div>
          </div>
          <div class="kbd-hint">단축키: 숫자 1–4 선택 · Enter / → 다음</div>
        </div>
      `;

      main.querySelectorAll("[data-opt]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (state.answered) return;
          const chosen = q.opts[Number(btn.dataset.opt)];
          state.selectedOption = chosen;
          state.answered = true;
          state.sessionTotal += 1;
          if (chosen === q.correct) {
            state.sessionCorrect += 1;
            if (getStatus(p.id) === "new") setStatus(p.id, "mastered");
          } else {
            setStatus(p.id, "review");
          }
          renderStats();
          renderMain();
        });
      });

      document.getElementById("qOk")?.addEventListener("click", () => { setStatus(p.id, "mastered"); renderMain(); });
      document.getElementById("qBad")?.addEventListener("click", () => { setStatus(p.id, "review"); renderMain(); });
      document.getElementById("qPrev")?.addEventListener("click", () => {
        state.index = (state.index - 1 + state.pool.length) % state.pool.length;
        state.answered = false;
        state.selectedOption = null;
        renderMain();
      });
      document.getElementById("qNext")?.addEventListener("click", () => {
        state.index = (state.index + 1) % state.pool.length;
        state.answered = false;
        state.selectedOption = null;
        renderMain();
      });
    }

    function renderExam(main) {
      if (state.examSet.length === 0) {
        const src = getFiltered();
        state.examSet = shuffle(src.length >= 3 ? src : PROJECTS).slice(0, 3);
      }

      main.innerHTML = `
        <div class="grid-list">
          ${state.examSet.map((p, idx) => {
            const rev = !!state.examRevealed[p.id];
            return `
              <div class="card">
                <div class="card-top">
                  <span class="chapter-badge">시험 1번 · 문제 ${idx + 1}/3</span>
                  <span class="counter">${rev ? p.chapter : ""}</span>
                </div>
                ${p.img ? renderPhotoBox(p, !rev) : ""}
                <h2 class="project-title">${p.name}</h2>
                <div class="exam-inputs">
                  <div><label class="field-label">Architecte</label><input type="text" placeholder="예: Alvar Aalto"></div>
                  <div><label class="field-label">Lieu</label><input type="text" placeholder="예: Säynätsalo, Finlande"></div>
                  <div><label class="field-label">Date</label><input type="text" placeholder="예: 1952"></div>
                </div>
                <div>
                  <label class="field-label">Courte description (FR)</label>
                  <textarea class="field-textarea" rows="2" placeholder="핵심 키워드 위주로 작성..."></textarea>
                </div>
                <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn primary" data-rev="${p.id}">${rev ? "정답 접기" : "정답 확인"}</button>
                  ${rev ? `
                    <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" data-ex-ok="${p.id}">암기 완료</button>
                    <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" data-ex-bad="${p.id}">복습 필요</button>
                  ` : ""}
                </div>
                ${rev ? renderDetailBlock(p) : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;

      main.querySelectorAll("[data-rev]").forEach(b => {
        b.addEventListener("click", () => {
          const id = Number(b.dataset.rev);
          state.examRevealed[id] = !state.examRevealed[id];
          renderMain();
        });
      });
      main.querySelectorAll("[data-ex-ok]").forEach(b => {
        b.addEventListener("click", () => { setStatus(Number(b.dataset.exOk), "mastered"); renderMain(); });
      });
      main.querySelectorAll("[data-ex-bad]").forEach(b => {
        b.addEventListener("click", () => { setStatus(Number(b.dataset.exBad), "review"); renderMain(); });
      });
    }

    function renderPairs(main) {
      main.innerHTML = `
        <div class="pairs-grid">
          ${CONFUSING_PAIRS.map(pair => `
            <div class="pair-card">
              <h3>${pair.title}</h3>
              <p>${pair.body}</p>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderList(main) {
      const q = state.searchQuery.trim().toLowerCase();
      const items = getFiltered().filter(p => {
        if (!q) return true;
        return (
          p.name.toLowerCase().includes(q) ||
          p.architect.toLowerCase().includes(q) ||
          p.location.toLowerCase().includes(q) ||
          p.year.toLowerCase().includes(q) ||
          p.desc.toLowerCase().includes(q)
        );
      });

      main.innerHTML = `
        <div class="grid-list">
          ${items.map(p => {
            const st = getStatus(p.id);
            return `
              <div class="list-row">
                <div class="list-thumb">
                  ${p.img
                    ? `<img src="${p.img}" alt="${p.name}" loading="lazy">`
                    : `<a href="${googleImgUrl(p)}" target="_blank" rel="noopener" style="color:inherit;padding:6px;">구글 이미지 ↗</a>`}
                </div>
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                    <div>
                      <span class="chapter-badge" style="margin-right:6px;">${p.chapter}</span>
                      <strong>${p.id}. ${p.name}</strong>
                    </div>
                    <select data-st-id="${p.id}" style="min-height:32px;padding:4px 10px;border-radius:980px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;">
                      <option value="new" ${st === "new" ? "selected" : ""}>미학습</option>
                      <option value="review" ${st === "review" ? "selected" : ""}>복습 필요</option>
                      <option value="mastered" ${st === "mastered" ? "selected" : ""}>암기 완료</option>
                    </select>
                  </div>
                  <div style="font-size:14px;color:var(--muted);margin:4px 0;">
                    <strong>${p.architect}</strong> · ${p.location} · <strong>${p.year}</strong>
                  </div>
                  <div style="font-size:14px;">${p.desc}</div>
                  ${p.koTip ? `<div style="font-size:13px;color:var(--muted);margin-top:4px;">↳ ${p.koTip}</div>` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;

      main.querySelectorAll("[data-st-id]").forEach(sel => {
        sel.addEventListener("change", e => setStatus(Number(sel.dataset.stId), e.target.value));
      });
    }

    function renderMain() {
      const main = document.getElementById("mainView");
      if (state.mode === "photo") renderPhotoQuiz(main);
      else if (state.mode === "flashcard") renderFlashcard(main);
      else if (state.mode === "quiz") renderQuiz(main);
      else if (state.mode === "exam") renderExam(main);
      else if (state.mode === "pairs") renderPairs(main);
      else renderList(main);
    }

    function render() {
      renderStats();
      renderControls();
      renderMain();
    }

    document.querySelectorAll("#modeTabs .pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#modeTabs .pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.mode = btn.dataset.mode;
        rebuildPool();
        render();
      });
    });

    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      if (state.mode === "photo") {
        if (e.code === "Space") { e.preventDefault(); document.getElementById("revealPhotoBtn")?.click(); }
        else if (e.key === "1") document.getElementById("pMastered")?.click();
        else if (e.key === "2") document.getElementById("pReview")?.click();
        else if (e.key === "ArrowRight") document.getElementById("pNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("pPrev")?.click();
      } else if (state.mode === "flashcard") {
        if (e.code === "Space") { e.preventDefault(); document.getElementById("flipBtn")?.click(); }
        else if (e.key === "1") document.getElementById("fcOk")?.click();
        else if (e.key === "2") document.getElementById("fcBad")?.click();
        else if (e.key === "ArrowRight") document.getElementById("fcNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("fcPrev")?.click();
      } else if (state.mode === "quiz") {
        if (["1", "2", "3", "4"].includes(e.key) && !state.answered) {
          document.querySelector(`[data-opt="${Number(e.key) - 1}"]`)?.click();
        } else if (e.key === "Enter" || e.key === "ArrowRight") {
          document.getElementById("qNext")?.click();
        } else if (e.key === "ArrowLeft") {
          document.getElementById("qPrev")?.click();
        }
      }
    });

    rebuildPool();
    render();
  </script>
</body>
</html>
