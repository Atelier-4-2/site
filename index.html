  <script>
    /* Laptops: scale the whole desktop layout down so each step fits the screen height. */
    (function () {
      var REF = 1200, MIN = 0.6, root = document.documentElement;
      function fit() {
        var z = 1;
        var dg = document.body && document.body.dataset.mode === "diagrams";
        if (document.body && document.body.dataset.mode === "board") z = 1;   /* board: never scale the page */
        else if (dg) z = window.matchMedia("(max-width: 799px)").matches ? 1 : Math.min(1, window.innerWidth / 1680);   /* phones: real layout, no zoom */
        else if (window.innerWidth >= 1024 && window.innerHeight < REF) z = Math.max(MIN, window.innerHeight / REF);
        root.style.zoom = z < 1 ? String(z) : "";
        root.classList.toggle("is-scaled", z < 1);
        if (z < 1) root.style.setProperty("--vh100", Math.round(window.innerHeight / z) + "px"); else root.style.removeProperty("--vh100");
      }
      fit();
      window.addEventListener("resize", fit);
      document.addEventListener("DOMContentLoaded", function () {
        new MutationObserver(fit).observe(document.body, {
          attributes: true, attributeFilter: ["data-mode", "data-page"]
        });
        fit();
      });
    })();
  </script>
