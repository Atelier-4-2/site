<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stair · Atelier 4·2</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --divider:#d2d2d7; --surface:#f5f5f7; --paper:#fff; --bg:#fff; --ok:#1b7f37; --warn:#b25000; --bad:#d70015; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Pretendard Variable","Pretendard",system-ui,sans-serif; word-break:keep-all; }
    header { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--divider); }
    .nav { max-width:1160px; margin:0 auto; padding:6px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .brand { font-weight:700; font-size:19px; text-decoration:none; color:var(--ink); flex:none; }
    .site-switch { display:inline-flex; gap:2px; padding:3px; border-radius:980px; background:var(--surface); overflow-x:auto; max-width:100%; scrollbar-width:none; }
    .site-switch::-webkit-scrollbar { display:none; }
    .site-switch a { flex:none; white-space:nowrap; padding:6px 10px; border-radius:980px; font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; }
    .site-switch a.cur { background:var(--ink); color:#fff; }
    main { max-width:1160px; margin:0 auto; padding:20px 16px 40px; display:grid; gap:16px; }
    h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
    .sub { margin:4px 0 0; color:var(--muted); font-size:14px; }
    .grid { display:grid; grid-template-columns:320px minmax(0,1fr); gap:16px; align-items:start; }
    .card { border:1px solid var(--line); border-radius:16px; padding:16px; background:var(--paper); display:grid; gap:10px; }
    .field { display:grid; gap:4px; font-size:13px; }
    .field input, .field select { min-height:38px; border:1px solid var(--divider); border-radius:10px; padding:0 10px; font:inherit; background:var(--surface); }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btn { min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--ink); background:var(--ink); color:#fff; font:600 13px/1 inherit; cursor:pointer; }
    .btn.ghost { background:transparent; color:var(--ink); border-color:var(--divider); }
    .checks { display:grid; gap:6px; font-size:13px; }
    .chk-pill { padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:flex; justify-content:space-between; gap:8px; }
    .chk-pill.ok b { color:var(--ok); } .chk-pill.warn b { color:var(--warn); } .chk-pill.bad b { color:var(--bad); }
    .svg-box { border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:14px; display:grid; gap:14px; overflow:auto; }
    .svg-box svg { width:100%; height:auto; background:#fff; border-radius:8px; border:1px solid var(--line); }
    .acts { display:flex; flex-wrap:wrap; gap:8px; }
    @media (max-width:840px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="https://atelier-4-2.github.io/">4·2 · Stair</a>
      <nav class="site-switch">
        <a href="./">Terrain</a>
        <a href="./#board">Board</a>
        <a href="https://atelier-4-2.github.io/view/">View</a>
        <a href="https://atelier-4-2.github.io/crit/">Crit</a>
        <a href="https://atelier-4-2.github.io/share/">Share</a>
        <a href="https://atelier-4-2.github.io/quiz/">Quiz</a>
        <a href="./stair.html" class="cur">Stair</a>
        <a href="./trait.html">Trait</a>
      </nav>
    </div>
  </header>

  <main>
    <div>
      <h1>계단 · 경사로 계산기</h1>
      <p class="sub">층고를 넣으면 블롱델 공식(2h+g)과 프랑스·한국 기준을 자동 확인하고, 1:50·1:100 평면·단면 SVG 및 Rhino용 DXF를 바로 뽑습니다.</p>
    </div>

    <div class="grid">
      <section class="card">
        <div class="row2">
          <label class="field">층고 H (cm)<input id="inH" type="number" min="50" max="1000" step="1" value="300"></label>
          <label class="field">계단 폭 W (cm)<input id="inW" type="number" min="60" max="400" step="5" value="120"></label>
        </div>
        <div class="row2">
          <label class="field">단수 N (0=자동)<input id="inN" type="number" min="0" max="60" step="1" value="0"></label>
          <label class="field">디딤판 g (cm, 0=자동)<input id="inG" type="number" min="0" max="50" step="0.5" value="0"></label>
        </div>
        <div class="row2">
          <label class="field">법규 기준
            <select id="inCode">
              <option value="fr_erp">프랑스 ERP (공공)</option>
              <option value="fr_log">프랑스 주거 (Logement)</option>
              <option value="kr">한국 건축법 (일반)</option>
            </select>
          </label>
          <label class="field">출력 축척
            <select id="inScale">
              <option value="50">1 : 50</option>
              <option value="100">1 : 100</option>
            </select>
          </label>
        </div>
        <div class="checks" id="checks"></div>
        <div class="acts">
          <button type="button" class="btn" id="btnSvg">SVG 내려받기</button>
          <button type="button" class="btn ghost" id="btnDxf">DXF 내려받기 (m)</button>
        </div>
        <div style="border-top:1px solid var(--line);padding-top:10px">
          <strong style="font-size:13px">PMR 경사로 참고 (같은 층고 H)</strong>
          <div id="rampInfo" style="font-size:12.5px;color:var(--muted);margin-top:4px;display:grid;gap:3px"></div>
        </div>
      </section>

      <section class="svg-box">
        <div id="svgWrap"></div>
      </section>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const RULES = {
      fr_erp: { name: "프랑스 ERP", maxH: 16, minG: 28, minW: 120 },
      fr_log: { name: "프랑스 주거", maxH: 18, minG: 24, minW: 90 },
      kr:     { name: "한국 기준",  maxH: 18, minG: 26, minW: 120 },
    };

    function compute() {
      const H = Math.max(50, +$("inH").value || 300);
      const W = Math.max(60, +$("inW").value || 120);
      const rule = RULES[$("inCode").value] || RULES.fr_erp;
      const inN = +$("inN").value || 0;
      const N = inN > 1 ? Math.round(inN) : Math.max(2, Math.ceil(H / Math.min(rule.maxH, 17)));
      const h = H / N;
      const inG = +$("inG").value || 0;
      const g = inG > 10 ? inG : Math.max(rule.minG, Math.round((62 - 2 * h) * 2) / 2);
      const blondel = 2 * h + g;
      const L = (N - 1) * g;
      const angle = Math.atan2(h, g) * 180 / Math.PI;
      const scale = +$("inScale").value || 50;
      return { H, W, N, h, g, blondel, L, angle, scale, rule };
    }

    function buildSvg(st) {
      const { H, W, N, h, g, L, scale } = st;
      // 1 unit = 1 cm in drawing coordinates, scaled to paper mm by (10 / scale)
      const k = 10 / scale; // mm per cm
      const pad = 40;
      const secW = L * k, secH = H * k, planH = W * k;
      const vbW = Math.max(240, secW + pad * 2 + 40);
      const vbH = secH + planH + pad * 3 + 30;
      const ox = pad + 20, sy0 = pad + secH, py0 = sy0 + pad + 18;

      let dSec = `M ${ox} ${sy0}`;
      for (let i = 0; i < N; i++) {
        const yUp = sy0 - (i + 1) * h * k;
        dSec += ` V ${yUp.toFixed(2)}`;
        if (i < N - 1) dSec += ` H ${(ox + (i + 1) * g * k).toFixed(2)}`;
      }
      const xEnd = ox + secW, yTop = sy0 - secH;
      const slabT = 15 * k;
      dSec += ` H ${(xEnd + 30 * k).toFixed(2)} V ${(yTop + slabT).toFixed(2)} H ${(xEnd + 5 * k).toFixed(2)} L ${(ox + 15 * k).toFixed(2)} ${sy0.toFixed(2)} Z`;

      const treads = [];
      for (let i = 0; i <= N - 1; i++) {
        const x = ox + i * g * k;
        treads.push(`<line x1="${x.toFixed(2)}" y1="${py0.toFixed(2)}" x2="${x.toFixed(2)}" y2="${(py0 + planH).toFixed(2)}" stroke="#1d1d1f" stroke-width="0.6"/>`);
      }
      const midY = py0 + planH / 2;

      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vbW.toFixed(1)} ${vbH.toFixed(1)}" width="${vbW.toFixed(1)}mm" height="${vbH.toFixed(1)}mm">
        <rect width="100%" height="100%" fill="#ffffff"/>
        <text x="${ox}" y="${pad - 12}" font-family="Pretendard, sans-serif" font-size="8" font-weight="700" fill="#1d1d1f">단면도 COUPE · 1:${scale} · ${N}단 (h=${h.toFixed(1)} × g=${g.toFixed(1)} cm)</text>
        <path d="${dSec}" fill="#f0f0f2" stroke="#1d1d1f" stroke-width="0.9"/>
        <line x1="${ox - 12}" y1="${sy0}" x2="${ox - 12}" y2="${yTop}" stroke="#6e6e73" stroke-width="0.4"/>
        <text x="${ox - 15}" y="${(sy0 + yTop) / 2}" font-family="Pretendard, sans-serif" font-size="6.5" fill="#6e6e73" text-anchor="end">H=${H}</text>
        <line x1="${ox}" y1="${sy0 + 10}" x2="${xEnd}" y2="${sy0 + 10}" stroke="#6e6e73" stroke-width="0.4"/>
        <text x="${(ox + xEnd) / 2}" y="${sy0 + 18}" font-family="Pretendard, sans-serif" font-size="6.5" fill="#6e6e73" text-anchor="middle">L=${L.toFixed(1)} cm</text>

        <text x="${ox}" y="${py0 - 6}" font-family="Pretendard, sans-serif" font-size="8" font-weight="700" fill="#1d1d1f">평면도 PLAN · W=${W} cm</text>
        <rect x="${ox}" y="${py0}" width="${secW.toFixed(2)}" height="${planH.toFixed(2)}" fill="none" stroke="#1d1d1f" stroke-width="0.9"/>
        ${treads.join("")}
        <line x1="${ox}" y1="${midY.toFixed(2)}" x2="${xEnd.toFixed(2)}" y2="${midY.toFixed(2)}" stroke="#d70015" stroke-width="0.5"/>
        <circle cx="${ox}" cy="${midY.toFixed(2)}" r="1.8" fill="#d70015"/>
        <polyline points="${(xEnd - 4).toFixed(2)},${(midY - 2.5).toFixed(2)} ${xEnd.toFixed(2)},${midY.toFixed(2)} ${(xEnd - 4).toFixed(2)},${(midY + 2.5).toFixed(2)}" fill="none" stroke="#d70015" stroke-width="0.6"/>
      </svg>`;
    }

    function buildDxf(st) {
      // Real-world meters in DXF R12
      const { H, W, N, h, g, L } = st;
      const lines = [];
      const addLine = (layer, x1, y1, x2, y2) => {
        lines.push("0","LINE","8",layer,"10",(x1/100).toFixed(4),"20",(y1/100).toFixed(4),"11",(x2/100).toFixed(4),"21",(y2/100).toFixed(4));
      };
      // Section (y >= 0)
      let x = 0, y = 0;
      for (let i = 0; i < N; i++) {
        addLine("STAIR_SECTION", x, y, x, y + h);
        y += h;
        if (i < N - 1) { addLine("STAIR_SECTION", x, y, x + g, y); x += g; }
      }
      addLine("STAIR_SECTION", 0, 0, L, 0);
      addLine("STAIR_SECTION", L, 0, L, H);
      // Plan (placed below y = -100 - W)
      const py = -(100 + W);
      addLine("STAIR_PLAN", 0, py, L, py);
      addLine("STAIR_PLAN", 0, py + W, L, py + W);
      for (let i = 0; i <= N - 1; i++) addLine("STAIR_PLAN", i * g, py, i * g, py + W);
      addLine("STAIR_ARROW", 0, py + W / 2, L, py + W / 2);
      return ["0","SECTION","2","ENTITIES",...lines,"0","ENDSEC","0","EOF"].join("\n");
    }

    let last = null;
    function update() {
      const st = last = compute();
      const bOk = st.blondel >= 60 && st.blondel <= 64;
      const hOk = st.h <= st.rule.maxH + 0.05;
      const gOk = st.g >= st.rule.minG - 0.05;
      const wOk = st.W >= st.rule.minW;
      const pill = (lbl, val, ok) => `<div class="chk-pill ${ok ? "ok" : "warn"}"><span>${lbl}</span><b>${val}</b></div>`;
      $("checks").innerHTML = [
        pill("단수 · 단높이 h", `${st.N}단 · ${st.h.toFixed(1)} cm (≤${st.rule.maxH})`, hOk),
        pill("디딤판 g", `${st.g.toFixed(1)} cm (≥${st.rule.minG})`, gOk),
        pill("블롱델 2h+g", `${st.blondel.toFixed(1)} cm (60–64)`, bOk),
        pill("수평 길이 · 경사", `${(st.L / 100).toFixed(2)} m · ${st.angle.toFixed(1)}°`, true),
        pill(`${st.rule.name} 폭`, `${st.W} cm (≥${st.rule.minW})`, wOk),
      ].join("");

      const r5 = st.H / 0.05 / 100, r8 = st.H / 0.08 / 100;
      const pal5 = Math.floor(r5 / 10);
      $("rampInfo").innerHTML = `
        <div>· 5% (1:20 권장): 수평 <b>${r5.toFixed(1)} m</b>${pal5 ? ` + 휴식참 ${pal5}개 (각 1.4m)` : ""}</div>
        <div>· 8% (1:12 허용): 수평 <b>${r8.toFixed(1)} m</b></div>
      `;
      $("svgWrap").innerHTML = buildSvg(st);
    }

    ["inH","inW","inN","inG","inCode","inScale"].forEach(id => $(id).addEventListener("input", update));
    $("btnSvg").onclick = () => {
      const b = new Blob([buildSvg(last)], { type: "image/svg+xml" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `stair_H${last.H}_1-${last.scale}.svg`; a.click();
    };
    $("btnDxf").onclick = () => {
      const b = new Blob([buildDxf(last)], { type: "application/dxf" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `stair_H${last.H}_m.dxf`; a.click();
    };
    update();
  </script>
</body>
</html>
